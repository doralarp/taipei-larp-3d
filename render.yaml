services:
  # 靜態網站 (Static Site - 免費、高速 CDN，首選推薦)
  - type: web
    name: taipei-larp-3d
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
