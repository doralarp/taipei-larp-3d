<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>台北劇本殺物語 3D · 劇本迷哆啦</title>
<meta name="description" content="全 3D 沉浸式劇本殺人生模擬 RPG。探索台北 14 家劇本殺名店，與上百位知名主持人與車友同桌飆戲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<script src="lib/three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
<script src="lib/OrbitControls.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';"></script>
<style>
:root {
  --navy: #080e1a;
  --win-bg: rgba(13, 22, 42, 0.94);
  --win-border: rgba(255, 210, 94, 0.38);
  --win-glow: 0 12px 40px rgba(0, 0, 0, 0.65);
  --gold: #ffd25e;
  --gold-deep: #f59e0b;
  --gold-light: #fef08a;
  --purple: #6366f1;
  --hp-green: #10b981;
  --bad-red: #f43f5e;
  --text-main: #f8fafc;
  --text-dim: #94a3b8;
  --font-main: "Noto Sans TC", sans-serif;
  --font-en: "Plus Jakarta Sans", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy); color: var(--text-main); font-family: var(--font-main); user-select: none; }
#canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
#webgl { display: block; width: 100%; height: 100%; outline: none; }

/* ---------- 1. 豪華深海藍 + 暖金 HUD 資訊介面 ---------- */
#hud {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px));
  left: calc(14px + env(safe-area-inset-left, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.hud-glass {
  background: var(--win-bg); border: 1px solid var(--win-border);
  box-shadow: var(--win-glow), inset 0 0 0 1px rgba(255,255,255,0.06);
  border-radius: 12px; backdrop-filter: blur(12px); color: var(--text-main); pointer-events: auto;
}
.hud-top-bar {
  display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; gap: 12px; flex-wrap: wrap;
}
.hud-cluster { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hud-pill {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; font-size: 13px; font-weight: 500;
}
.hud-pill .icon { font-size: 15px; }
.hud-pill.gold { border-color: rgba(255, 210, 94, 0.35); color: var(--gold); }
.hud-pill.gold b { color: #fff; font-family: var(--font-en); font-weight: 700; margin-left: 2px; }
.hud-pill.location { color: #e2e8f0; font-weight: 500; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 體力水晶進度條 */
.hp-track {
  width: 90px; height: 10px; background: rgba(0,0,0,0.4); border-radius: 6px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12); position: relative;
}
.hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width .3s; }
.hp-low { background: linear-gradient(90deg, #f43f5e, #fb7185) !important; }

/* 頂部快捷按鈕 */
.hud-actions { display: flex; align-items: center; gap: 6px; pointer-events: auto; }
.btn-hud {
  background: rgba(18, 28, 54, 0.85); color: var(--text-main); border: 1px solid var(--win-border);
  border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 5px; transition: all .18s; font-family: var(--font-main);
}
.btn-hud:hover, .btn-hud:active { background: rgba(255, 210, 94, 0.18); border-color: var(--gold); color: var(--gold-light); transform: translateY(-1px); }

/* 五維能力視覺核心徽章列 */
.hud-stats-bar {
  display: flex; align-items: center; gap: 6px; padding: 5px 12px; overflow-x: auto; scrollbar-width: none;
}
.hud-stats-bar::-webkit-scrollbar { display: none; }
.stat-badge {
  display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 8px;
  background: rgba(10, 16, 32, 0.55); border: 1px solid rgba(255,255,255,0.08); font-size: 12px;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.stat-badge:hover { border-color: var(--gold); background: rgba(255, 210, 94, 0.12); }
.stat-badge i { font-style: normal; font-size: 14px; }
.stat-badge .name { color: var(--text-dim); }
.stat-badge .val { color: var(--gold); font-family: var(--font-en); font-weight: 700; }

/* ---------- 3D 浮動互動提示標記 ---------- */
#prompt-bubble {
  position: absolute; z-index: 15; transform: translate(-50%, -100%); pointer-events: none;
  background: rgba(12, 19, 38, 0.96); border: 1.5px solid var(--gold); box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 12px rgba(255, 210, 94, 0.3);
  padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #fff;
  display: none; align-items: center; gap: 6px; transition: opacity .2s, transform .2s;
}
#prompt-bubble.show { display: flex; animation: promptBounce .8s infinite alternate ease-in-out; }
@keyframes promptBounce { from { transform: translate(-50%, -100%); } to { transform: translate(-50%, -108%); } }
#prompt-bubble .key-tag {
  background: var(--gold); color: #0f172a; padding: 2px 7px; border-radius: 6px; font-weight: 800; font-size: 11px;
}

/* ---------- 視窗 & 模態框 (Modals) ---------- */
.modal-overlay {
  position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(4, 7, 16, 0.72); backdrop-filter: blur(8px);
}
.modal-overlay[hidden] { display: none !important; }
.modal-box {
  width: min(720px, 100%); max-height: min(84vh, 720px); display: flex; flex-direction: column;
  background: var(--win-bg); border: 1.5px solid var(--win-border); border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.85), inset 0 0 0 1px rgba(255,255,255,0.08); overflow: hidden;
}
.modal-header {
  padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.09); display: flex;
  align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.02);
}
.modal-title-group h2 { font-size: 19px; font-weight: 700; color: var(--gold); letter-spacing: .02em; }
.modal-title-group .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.btn-close {
  background: transparent; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; padding: 4px;
}
.btn-close:hover { color: #fff; }
.modal-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.6; }
.modal-footer {
  padding: 12px 20px 16px; border-top: 1px solid rgba(255,255,255,0.09); display: flex; gap: 10px;
  justify-content: flex-end; flex-wrap: wrap; background: rgba(0,0,0,0.18);
}

/* 按鈕風格 */
.btn-primary {
  background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; border: 1px solid var(--gold);
  border-radius: 8px; padding: 8px 18px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all .18s;
}
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4); }
.btn-secondary {
  background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px; padding: 8px 16px; font-weight: 500; font-size: 14px; cursor: pointer; transition: all .18s;
}
.btn-secondary:hover { background: rgba(255,255,255,0.14); color: #fff; }

/* 劇本列表卡片 */
.chips-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip {
  padding: 4px 12px; border-radius: 20px; font-size: 12px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12); color: var(--text-dim); cursor: pointer; white-space: nowrap;
}
.chip.active { background: var(--gold); color: #0f172a; border-color: var(--gold); font-weight: 700; }
.script-list { display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow-y: auto; }
.script-card {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: all .15s;
}
.script-card:hover { background: rgba(255, 210, 94, 0.08); border-color: rgba(255, 210, 94, 0.4); }
.script-card .t { font-weight: 700; font-size: 15px; color: #fff; }
.script-card .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.script-card .price { font-size: 14px; color: var(--gold); font-weight: 700; font-family: var(--font-en); text-align: right; }

/* 對話視窗 */
.dialog-layout { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: start; }
@media (max-width: 580px) { .dialog-layout { grid-template-columns: 1fr; } }
.avatar-col { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.avatar-box {
  width: 110px; height: 110px; border-radius: 16px; background: #1a264a; border: 2px solid var(--gold);
  overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 44px;
}
.avatar-name { font-weight: 700; font-size: 16px; color: var(--gold); }
.avatar-role { font-size: 11px; color: var(--text-dim); }
.dialog-content { display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.7; }
.dialog-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.dialog-opt-btn {
  text-align: left; padding: 10px 14px; border-radius: 8px; background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 210, 94, 0.25); color: #fff; cursor: pointer; transition: all .15s; font-size: 14px;
}
.dialog-opt-btn:hover { background: rgba(255, 210, 94, 0.15); border-color: var(--gold); transform: translateX(3px); }

/* 店內 3D 空間覆蓋資訊 */
#room-ui {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 20;
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; pointer-events: auto;
}
.room-bar-btn {
  padding: 10px 20px; font-size: 14px; font-weight: 700; border-radius: 10px; cursor: pointer;
  background: var(--win-bg); border: 1.5px solid var(--win-border); color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: flex; align-items: center; gap: 6px; transition: all .18s;
}
.room-bar-btn:hover { background: rgba(255,210,94,0.18); border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

/* 全螢幕大事件卡片 (Cinematic Card) */
#event-card-overlay {
  position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
  background: rgba(3, 6, 16, 0.88); backdrop-filter: blur(14px); padding: 20px;
}
#event-card-overlay[hidden] { display: none !important; }
.event-card {
  width: min(560px, 100%); background: linear-gradient(145deg, #101c38, #182348); border: 2px solid var(--gold);
  border-radius: 20px; padding: 28px; box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 30px rgba(255,210,94,0.3);
  text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; animation: cardPop .35s ease-out;
}
@keyframes cardPop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.event-card .tag { font-size: 12px; letter-spacing: .2em; color: var(--gold); font-weight: 700; }
.event-card h2 { font-size: 26px; color: #fff; }
.event-card p { font-size: 15px; color: #cbd5e1; line-height: 1.7; }

/* 冒險手冊 & IG限動名片 */
.stamps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.stamp-item {
  border: 1px dashed rgba(255,255,255,0.14); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  color: var(--text-dim); display: flex; flex-direction: column; gap: 2px;
}
.stamp-item.got { border-style: solid; border-color: var(--gold); color: var(--text-main); background: rgba(255, 210, 94, 0.08); }

/* 手機觸控虛擬方向鈕 */
#mobile-pad {
  position: absolute; left: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 140px; height: 140px; z-index: 25; display: none;
}
@media (pointer: coarse) { #mobile-pad { display: block; } }
.d-btn {
  position: absolute; width: 44px; height: 44px; background: rgba(15, 23, 42, 0.85);
  border: 1.5px solid var(--win-border); border-radius: 12px; color: var(--gold); font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none;
}
.d-btn:active { background: rgba(255, 210, 94, 0.3); }
.d-btn.u { left: 48px; top: 0; }
.d-btn.d { left: 48px; top: 96px; }
.d-btn.l { left: 0; top: 48px; }
.d-btn.r { left: 96px; top: 48px; }

/* 飄字 Toast */
#toast {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 40;
  padding: 8px 18px; background: rgba(12, 18, 36, 0.92); border: 1px solid var(--gold);
  border-radius: 20px; font-size: 13px; color: #fff; pointer-events: none; transition: opacity .25s; opacity: 0;
}

/* ---------- 2.0 抽屜式卡片 (Bottom Sheet) ---------- */
.bottom-sheet {
  position: absolute; inset: 0; z-index: 45; pointer-events: none;
  display: flex; flex-direction: column; justify-content: flex-end;
  transition: opacity .25s ease;
}
.bottom-sheet[hidden] { display: none !important; }
.sheet-scrim {
  position: absolute; inset: 0; background: rgba(3, 6, 16, 0.45);
  pointer-events: auto; backdrop-filter: blur(2px); opacity: 0; transition: opacity .3s;
}
.bottom-sheet.open .sheet-scrim { opacity: 1; }
.sheet-container {
  position: relative; z-index: 2; pointer-events: auto;
  width: min(640px, 100%); margin: 0 auto;
  background: var(--win-bg); border: 1.5px solid var(--win-border); border-bottom: none;
  border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
  display: flex; flex-direction: column; max-height: min(62vh, 520px);
  transform: translateY(100%); transition: transform .32s cubic-bezier(0.16, 1, 0.3, 1);
}
.bottom-sheet.open .sheet-container { transform: translateY(0); }
.sheet-handle-bar { width: 100%; padding: 8px 0 4px; display: flex; justify-content: center; cursor: grab; }
.sheet-handle { width: 44px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; }
.sheet-header {
  padding: 8px 18px 12px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sheet-title-group h3 { font-size: 18px; font-weight: 700; color: var(--gold); }
.sheet-title-group .sheet-sub { font-size: 12px; color: var(--text-dim); }
.sheet-close { background: transparent; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px; }
.sheet-close:hover { color: #fff; }
.sheet-body { padding: 14px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.sheet-footer {
  padding: 10px 18px 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 8px; justify-content: flex-end;
  background: rgba(0,0,0,0.2);
}

/* 浮動視角重設按鈕 */
.btn-floating-reset {
  position: absolute; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 25; background: rgba(13, 22, 42, 0.9); border: 1px solid var(--win-border);
  color: var(--gold); border-radius: 24px; padding: 7px 14px; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 5px; cursor: pointer; backdrop-filter: blur(8px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5); transition: all .15s; font-family: var(--font-main);
}
.btn-floating-reset:hover { background: rgba(255,210,94,0.18); transform: translateY(-1px); }

/* 鎖定 Canvas 容器觸控行為，防止意外下拉重整 */
#canvas-container, #webgl { touch-action: none; }


/* 迷你能力值進度條 */
.mini-stat-track {
  width: 32px; height: 5px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12); margin: 0 2px;
}
.mini-stat-fill {
  height: 100%; width: 20%; background: linear-gradient(90deg, #f59e0b, #ffd25e);
  border-radius: 3px; transition: width .3s ease;
}
.stat-badge:hover .mini-stat-fill {
  background: linear-gradient(90deg, #00f5d4, #38bdf8);
}

</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="webgl"></canvas>
</div>

<!-- 浮動互動提示 -->
<div id="prompt-bubble"><span class="key-tag">空白鍵</span><span id="prompt-text">進入店家</span></div>

<!-- 頂部 HUD -->
<div id="hud">
  <div class="hud-glass hud-top-bar">
    <div class="hud-cluster">
      <div class="hud-pill" title="遊戲日期與時間"><span class="icon">📅</span><span id="hud-date">2026年11月</span> <span id="hud-clock" style="font-family:var(--font-en);font-weight:700">09:00</span> <span id="hud-weather">☀️</span></div>
      <div class="hud-pill gold" title="金錢"><span class="icon">🪙</span><span id="hud-money">NT$ 1,500</span></div>
      <div class="hud-pill" title="體力">
        <span class="icon">⚡</span>
        <div class="hp-track"><div class="hp-fill" id="hud-hp-bar"></div></div>
        <span id="hud-hp-num" style="font-family:var(--font-en);font-weight:700">100</span>
      </div>
      <div class="hud-pill" title="名譽"><span class="icon">👑</span><span id="hud-rep-val">50</span> <span id="hud-rep-title" style="color:var(--gold);font-size:11px">[常駐玩家]</span></div>
    </div>
    <div class="hud-cluster">
      <div class="hud-pill location"><span class="icon">📍</span><span id="hud-location">台北車站 · 忠孝西路</span></div>
      <div class="hud-actions">
        <button class="btn-hud" id="btn-cam" type="button" title="切換鏡頭視角">📷 俯視</button>
        <button class="btn-hud" id="btn-map" type="button" title="台北全景導航">🗺️ 地圖</button>
        <button class="btn-hud" id="btn-menu" type="button" title="冒險手冊 & 車友履歷">📱 手冊</button>
        <button class="btn-hud" id="btn-sound" type="button" title="音效開關">♪ 音效 開</button>
      </div>
    </div>
  </div>

  <!-- 五維能力核心徽章列 (附小型視覺化進度條) -->
  <div class="hud-glass hud-stats-bar">
    <div class="stat-badge" data-stat="logic" title="點擊查看能力詳情">
      <i>🔍</i><span class="name">推理</span>
      <div class="mini-stat-track"><div class="mini-stat-fill" id="stat-fill-logic"></div></div>
      <span class="val" id="stat-logic">Lv.2 20</span>
    </div>
    <div class="stat-badge" data-stat="heart" title="點擊查看能力詳情">
      <i>💖</i><span class="name">共情</span>
      <div class="mini-stat-track"><div class="mini-stat-fill" id="stat-fill-heart"></div></div>
      <span class="val" id="stat-heart">Lv.2 20</span>
    </div>
    <div class="stat-badge" data-stat="nerve" title="點擊查看能力詳情">
      <i>🔥</i><span class="name">膽識</span>
      <div class="mini-stat-track"><div class="mini-stat-fill" id="stat-fill-nerve"></div></div>
      <span class="val" id="stat-nerve">Lv.2 20</span>
    </div>
    <div class="stat-badge" data-stat="mech" title="點擊查看能力詳情">
      <i>♟️</i><span class="name">策略</span>
      <div class="mini-stat-track"><div class="mini-stat-fill" id="stat-fill-mech"></div></div>
      <span class="val" id="stat-mech">Lv.2 20</span>
    </div>
    <div class="stat-badge" data-stat="rep" title="點擊查看名譽詳情">
      <i>👑</i><span class="name">名譽</span>
      <span class="val" id="stat-rep">50</span>
    </div>
  </div>
</div>

<!-- 店內 3D 空間控制底欄 (進入店家後顯示) -->
<div id="room-ui" hidden>
